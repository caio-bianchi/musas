[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utm-simulator"
version = "0.1.0"
description = "Extensible simulator for UAV traffic management research"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pillow",
    "simpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
